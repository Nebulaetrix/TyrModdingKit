name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build packager
        run: |
          $proj = "TyrModPackager/UnrealReZen/UnrealReZen.csproj"
          Get-Content $proj
          dotnet --info | Select-String "Version|RID"
          Get-ChildItem TyrModPackager -Recurse -Directory -Include obj,bin -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
          dotnet restore $proj -r win-x64 --force -p:NuGetAudit=false -v d > restore.log 2>&1
          $code = $LASTEXITCODE
          Select-String -Path restore.log -Pattern "Failed to restore" -Context 60,0 | ForEach-Object { $_.Context.PreContext + $_.Line } | Where-Object { $_ -notmatch "Pruning|prunable|MSB4276" } | Select-Object -Last 40
          if ($code -ne 0) { exit $code }
          dotnet publish $proj -c Release -r win-x64 --self-contained --no-restore -p:NuGetAudit=false -o build-packager
          Copy-Item packager-deps/* build-packager -Recurse -Force

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Configure
        run: |
          $ws = $env:GITHUB_WORKSPACE -replace '\\','/'
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Game__Dev__Win64 `
            -DGAME_MODS_DIR="$ws/stage/Win64/ue4ss/Mods" `
            -DGAME_EXE_DIR="$ws/stage/Win64"

      - name: Build
        run: cmake --build build --target ModdingAPI SkinBrowser SignatureBypass

      - name: Package
        run: |
          Copy-Item build-packager stage/TyrModPackager -Recurse
          Compress-Archive -Path stage/* -DestinationPath "TyrModdingKit-$env:RELEASE_VERSION.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:RELEASE_VERSION" "TyrModdingKit-$env:RELEASE_VERSION.zip"
          --title "$env:RELEASE_VERSION" --generate-notes